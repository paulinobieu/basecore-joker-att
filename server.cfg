# 1. REDE - Primeiro sempre
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# 2. LICENÇA E CHAVES - Logo após endpoints
sv_licenseKey 
set steam_webApiKey ""

# 3. IDENTIDADE DO SERVIDOR
sv_hostname "Core Network | Rebirth"
sets sv_projectName "Base Rebirth | discord.gg/corenetworkdev"
sets locale "pt-BR"
sets tags "rp, roleplay, ..."
load_server_icon server.png
sv_maxClients 5

# 4. INFORMAÇÕES PÚBLICAS
sets Grupo "Core Network"
sets Desenvolvedor "@paulinobieu e @nagasakicode"
sets Discord "https://corenetwork.dev/"
sets banner_detail ""
sets banner_connecting ""

# 5. GAME BUILD E ONESYNC
set sv_enforceGameBuild 3095
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
set onesync on
set onesync_population true
set onesync_forceMigration true
set onesync_workaround763185 true
set onesync_distanceCullVehicles true

# 6. SEGURANÇA E PRIVACIDADE
sv_scriptHookAllowed 0
sv_endpointprivacy true

sets sv_appearAllowlisted "true"
# Define as instruções visíveis na lista de servidores
sets sv_allowlistInstructions "Entre no Discord para aplicar: discord.gg/corenetworkdev"    
#rcon_password

# 7. BANCO DE DADOS
set mysql_connection_string "mysql://root:@localhost:3306/corenetwork"
set mysql_slow_query_warning 150

# 8. PERFORMANCE - POOL SIZES
increase_pool_size "CMoveObject" 75
increase_pool_size "FragmentStore" 14000
increase_pool_size "OcclusionInteriorInfo" 20
increase_pool_size "OcclusionPathNode" 5000
increase_pool_size "OcclusionPortalEntity" 750
increase_pool_size "OcclusionPortalInfo" 750
increase_pool_size "PortalInst" 225
increase_pool_size "ScaleformStore" 200
increase_pool_size "StaticBounds" 5000
increase_pool_size "TxdStore" 26000

# 9. VOZ
setr voice_syncData 1
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
set mumble_maxClientsPerIP 1024

# 10. VARS CUSTOMIZADAS
setr profile_skfx 0

# 11. WEBHOOKS
setr Discord_MDT ""
setr Discord_EMS ""
setr Discord_FREECAM ""

# 12. ACE PERMISSIONS - Antes dos recursos
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_principal identifier.steam:11000010c6d36de group.admin

# 13. RECURSOS - Sempre por último
start vrp
start [system]
ensure core-bank
start [weapons]
start [scripts]
start [core]
start [smartphone]

# MODS
start [clothes]
start [vehicles]
start cfx-core
start [cfx]
start [sandyshores]
start cfx_prompt_sandy_mapdata
start vertex-hub
